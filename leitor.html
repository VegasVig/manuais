<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manual — Central de Manuais Técnicos · Vegas Vigilância e Segurança</title>
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%230b1220%27/%3E%3Cpath d=%27M5 8h22l-9 17h-4z%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('vegas-tema'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/leitor.css">
</head>
<body class="leitor">

<header class="topbar topbar--leitor">
  <div class="topbar__left">
    <a class="voltar" href="index.html" aria-label="Voltar para as centrais">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span>Centrais</span>
    </a>
    <a class="brand" href="index.html" aria-label="Vegas Vigilância e Segurança — início"><span class="logo logo--sm" role="img" aria-label="Vegas Vigilância e Segurança"></span></a>
  </div>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar tema claro/escuro" aria-pressed="false">
    <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <span class="theme-toggle__label" id="themeLabel">Tema escuro</span>
  </button>
</header>

<div class="barra-busca" id="barraBusca">
  <div class="barra-busca__in">
    <button class="btn-sumario" id="btnSumario" type="button" aria-controls="sumario" aria-expanded="false" aria-label="Abrir sumário">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
    <div class="busca" role="search">
      <svg class="busca__lupa" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar no manual… ex.: cadastrar controle remoto" autocomplete="off" enterkeyhint="search" aria-label="Buscar no manual" aria-controls="resultados">
      <button class="mic" id="mic" type="button" aria-label="Buscar por voz" title="Buscar por voz">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
    </div>
    <select id="escopo" class="escopo" aria-label="Onde buscar">
      <option value="atual">Esta central</option>
      <option value="todas">Todas</option>
    </select>
  </div>
  <p class="ouvindo" id="ouvindo" hidden aria-live="assertive"><span class="pulso"></span><span id="ouvindoTxt">Ouvindo… fale o que procura</span></p>
  <div class="resultados" id="resultados" role="region" aria-label="Resultados da busca" hidden>
    <div class="resultados__topo"><span id="resInfo" aria-live="polite"></span><button type="button" id="fecharRes" class="link-btn">Fechar</button></div>
    <ol id="resLista"></ol>
  </div>
</div>

<div class="layout">
  <nav class="sumario" id="sumario" aria-label="Sumário do manual">
    <div class="sumario__topo">
      <strong>Sumário</strong>
      <button type="button" class="link-btn" id="fecharSumario">Fechar</button>
    </div>
    <ol id="tocLista"></ol>
  </nav>
  <div class="veu" id="veu" hidden></div>

  <main class="manual" id="manual" tabindex="-1">
    <header class="manual__cab" id="cab"></header>
    <div id="conteudo"><p class="carregando">Carregando manual…</p></div>
  </main>
</div>

<button class="topo-btn" id="topoBtn" type="button" aria-label="Voltar ao topo" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
</button>

<footer class="foot">Vegas Vigilância e Segurança · Uso interno</footer>

<script src="js/theme.js"></script>
<script src="js/leitor.js"></script>
</body>
</html>
