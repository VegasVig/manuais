<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central de Manuais Técnicos — Vegas Vigilância e Segurança</title>
<meta name="description" content="Biblioteca de consulta técnica para instalação, programação e manutenção de centrais de alarme.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%230b1220%27/%3E%3Cpath d=%27M5 8h22l-9 17h-4z%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<link rel="preload" as="image" href="assets/vegon-poster.jpg">
<!-- Aplica o tema salvo antes da pintura, evitando "flash" -->
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('vegas-tema'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Vídeo de fundo (sem áudio) -->
<div class="bg" aria-hidden="true">
  <video id="bgVideo" autoplay muted loop playsinline preload="auto" poster="assets/vegon-poster.jpg" disablepictureinpicture>
    <source src="assets/vegon-bg.webm" type="video/webm">
    <source src="assets/vegon-bg.mp4" type="video/mp4">
  </video>
  <div class="bg__shade"></div>
</div>

<header class="topbar">
  <a class="brand" href="index.html" aria-label="Vegas Vigilância e Segurança — início">
    <span class="logo" role="img" aria-label="Vegas Vigilância e Segurança"></span>
  </a>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar tema claro/escuro" aria-pressed="false">
    <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <span class="theme-toggle__label" id="themeLabel">Tema escuro</span>
  </button>
</header>

<main class="wrap">
  <section class="hero">
    <p class="eyebrow">Biblioteca técnica</p>
    <h1>Central de Manuais Técnicos</h1>
    <p class="sub">Escolha a central de alarme para consultar instalação, programação e manutenção.</p>

    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="filtro" type="search" placeholder="Buscar central: AMT 8000, Active, 2018…" autocomplete="off" aria-label="Buscar central">
    </div>

    <div class="chips" role="group" aria-label="Filtrar por marca">
      <button class="chip is-on" data-marca="all" type="button">Todas</button>
      <button class="chip" data-marca="JFL" type="button">JFL</button>
      <button class="chip" data-marca="Intelbras" type="button">Intelbras</button>
    </div>

    <p class="stats" id="stats" aria-live="polite"></p>
  </section>

  <section class="grid" id="grid" aria-label="Centrais disponíveis"></section>
  <p class="empty" id="vazio" hidden>Nenhuma central encontrada para essa busca.</p>
</main>

<footer class="foot">Vegas Vigilância e Segurança · Uso interno</footer>

<script src="js/theme.js"></script>
<script src="js/app.js"></script>
</body>
</html>
